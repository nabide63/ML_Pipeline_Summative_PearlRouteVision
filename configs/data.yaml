# Data settings: classes, labelling rules, sources, cleaning and splitting.
# Region: East Africa (Uganda, Kenya, Tanzania, Rwanda, Burundi, eastern DR Congo, Ethiopia, South Sudan, Somalia).
# Label by what the photo SHOWS, not where it was taken. When a photo could fit two classes,
# label_rules (below) decide, e.g. a raft or kayak always means whitewater_rafting.

seed: 42

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  metadata_csv: data/metadata.csv
  manual_exclude: data/exclude.txt          # filenames you reject by eye, one per line
  train_exclude: data/train_exclude.txt     # wrong labels removed from TRAIN only, after splitting
  cleaned_csv: data/processed/cleaned.csv
  dropped_csv: data/processed/dropped.csv
  splits_csv: data/processed/splits.csv
  counts_json: data/counts.json
  stats_json: data/stats.json               # train-set channel mean/std used to normalise
  demo_dir: data/demo
  retrain_dir: data/retrain_sample
  retrain_zip: data/retrain_sample.zip

