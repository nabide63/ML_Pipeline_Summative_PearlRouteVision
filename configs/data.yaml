# Data settings: classes, labelling rules, sources, cleaning and splitting.
# Label by what the photo SHOWS, not where it was taken.

seed: 42

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  metadata_csv: data/metadata.csv
  manual_exclude: data/exclude.txt          # filenames you reject by eye, one per line
  cleaned_csv: data/processed/cleaned.csv
  dropped_csv: data/processed/dropped.csv
  splits_csv: data/processed/splits.csv
  counts_json: data/counts.json
  demo_dir: data/demo
  retrain_dir: data/retrain_sample
  retrain_zip: data/retrain_sample.zip

classes:
  gorilla_primate_trekking:
    rule: "A gorilla, chimpanzee or monkey is the main subject, usually in forest."
    destinations: [Bwindi, Mgahinga, Kibale]
    search_terms:
      - Bwindi gorilla
      - mountain gorilla
      - mountain gorilla trekking
      - chimpanzee Kibale
      - Mgahinga gorilla
      - golden monkey Uganda
    fallback_terms:
      - Volcanoes National Park gorilla
      - gorilla Rwanda
      - chimpanzee forest Africa
    wikimedia_categories:
      - Bwindi Impenetrable National Park
      - Gorilla beringei beringei
      - Kibale National Park
      - Mgahinga Gorilla National Park
      - Pan troglodytes schweinfurthii   # eastern chimpanzee
  wildlife_safari:
    rule: "Large savanna animals (elephant, lion, buffalo, giraffe, antelope) or a game-drive vehicle in open grassland."
    destinations: [Murchison Falls NP, Queen Elizabeth NP, Kidepo Valley NP]
    search_terms:
      - Murchison Falls elephants
      - Queen Elizabeth National Park lion
      - Kidepo buffalo
      - Uganda kob
      - Uganda safari game drive
      - tree climbing lions Ishasha
    fallback_terms:
      - Serengeti safari
      - Maasai Mara game drive
      - African elephant savanna
    wikimedia_categories:
      - Queen Elizabeth National Park
      - Kidepo Valley National Park
      - Murchison Falls National Park
      - Mammals of Uganda
  whitewater_rafting:
    rule: "A raft or kayak is visible in rapids."
    destinations: [Jinja (the Nile)]
    search_terms:
      - Nile rafting Jinja
      - white water rafting Uganda
      - rafting rapids
      - white water rafting
      - kayaking rapids Nile
    fallback_terms:
      - whitewater rafting Zambezi
      - white water kayak
    wikimedia_categories:
      - Rafting in Uganda
      - Whitewater rafting
  waterfalls:
    rule: "Falling water is the main subject, with no boat."
    destinations: [Sipi Falls, Itanda Falls, Murchison Falls]
    search_terms:
      - Sipi Falls
      - Murchison Falls waterfall
      - Itanda Falls
      - waterfall Uganda
      - Ssezibwa Falls
    fallback_terms:
      - waterfall Kenya
      - waterfall Rwanda
      - waterfall Tanzania
    wikimedia_categories:
      - Sipi falls
      - Murchison Falls
      - Itanda Falls
      - Waterfalls in Uganda
  mountain_hiking:
    rule: "Mountain scenery, peaks or trails, often with hikers; no waterfall as the main subject."
    destinations: [Rwenzori Mountains, Mount Elgon]
    search_terms:
      - Rwenzori hiking
      - Rwenzori Mountains
      - Mount Elgon trek
      - mountain trail Uganda
      - Mount Moroto
    fallback_terms:
      - Kilimanjaro hike
      - Mount Kenya trek
      - Virunga volcano hike
    wikimedia_categories:
      - Ruwenzori Range
      - Rwenzori Mountains National Park
      - Mount Elgon
      - Mount Elgon National Park
  cultural_heritage:
    rule: "Traditional dance, crafts, people in cultural dress, or heritage sites and monuments."
    destinations: [Source of the Nile, Kasubi Tombs, Ndere Centre]
    search_terms:
      - Kasubi Tombs
      - Ugandan traditional dance
      - Ndere Centre
      - Source of the Nile monument
      - Buganda culture
      - Uganda Martyrs Shrine Namugongo
    fallback_terms:
      - Rwandan traditional dance
      - Kenyan cultural dance
      - Maasai dance
    wikimedia_categories:
      - Kasubi Tombs
      - Source of Nile
      - Source of the Nile (marker)
      - Ndere Centre
      - Dance of Uganda
      - Culture of Uganda

sources:
  # Generic client name; add your own contact (e.g. a URL) here if you want to, as Wikimedia's policy suggests.
  user_agent: "PearlRouteVision/0.1 (https://github.com/nabide63/ML_Pipeline_Summative_PearlRouteVision) python-requests"
  openverse_api: https://api.openverse.org/v1
  openverse_page_size: 20        # anonymous max is 20; up to 500 with an API key
  wikimedia_api: https://commons.wikimedia.org/w/api.php
  wikimedia_page_size: 50
  wikimedia_thumb_width: 960     # a standard Commons thumbnail size; others are rate-limited harder

collection:
  target_per_class: 700          # download this many; keep 450-500 after cleaning
  fallback_threshold: 350        # use fallback_terms if a class stays below this after cleaning
  per_query_limit: 200           # max candidates per search term per source
  per_category_limit: 400        # max candidates per Wikimedia category tree
  request_sleep_seconds: 1.0     # pause between API calls
  download_sleep_seconds: 1.0    # pause between image downloads (upload.wikimedia.org returns 429 if faster)
  timeout_seconds: 20
  max_retries: 4
  backoff_seconds: 5             # doubles on each retry
  max_retry_after_seconds: 300   # cap on a server's Retry-After
  max_side_on_save: 1024         # downscale large images when saving
  jpeg_quality: 92
  openverse_licenses: [by, by-sa, cc0, pdm]  # allow reuse and modification
  wikimedia_subcategory_depth: 2
  # Skipped before download: archive photographers and titles that are not photos of the experience.
  exclude_creators:
    - Luigi Amedeo di Savoia      # 1906 Rwenzori expedition, almost all black-and-white
  exclude_title_words: [map, maps, locator, poster, page, drawing, illustration, stamp, logo,
                        diagram, chart, sign, signpost, plate, herbarium, specimen, coin,
                        banknote, flag, bus, buses, BHL]
  min_colourfulness: 6.0          # skip black-and-white photos after download

cleaning:
  min_short_side: 160
  phash_max_distance: 6
  allowed_extensions: [.jpg, .jpeg, .png, .webp]

holdout:
  demo_total: 10               # outside every split; predicted on camera
  retrain_per_class: 10        # goes into retrain_sample.zip

split:
  train: 0.70
  val: 0.15
  test: 0.15
  group_by: creator            # keep each photographer in a single split
  max_class_imbalance: 1.5     # above this, use class weights
