# Labelling rules, checked in order BEFORE a photo is downloaded, against its title, its tags
# (Openverse) and its own Commons categories. The first rule that matches decides the label,
# whatever search found the photo: a kayak found by a waterfall search is saved as whitewater_rafting.
# label: null drops the photo. A rule matches when the text has one of `words`, and also one of
# `with_words` if given, and none of `unless`. Whole words or phrases, case-insensitive; plurals
# ending in -s/-es match too (lion -> lions, buffalo -> buffaloes).
# scripts/apply_label_rules.py applies the same rules to photos already downloaded.
label_rules:
  - label: whitewater_rafting          # a raft or kayak always means rafting, even below a waterfall
    words: [raft, rafting, rafter, kayak, kayaking, kayaker, canoe, canoeing, canoeist, packraft]
  - label: whitewater_rafting          # other boats count when they are on a river or rapids
    words: [boat, boats, dinghy, inflatable]
    with_words: [river, rapids, rapid, nile, falls, waterfall, jinja, sagana, tana, white water, whitewater]
  - label: null                        # boats on lakes and the sea (dhows, ferries, launches) fit no class
    words: [boat, boats, dhow, dhows, ferry, ship, ships, launch cruise, boat cruise, sailing, yacht]
  - label: gorilla_primate_trekking
    words: [gorilla, gorillas, chimpanzee, chimpanzees, chimp, chimps, monkey, monkeys, colobus,
            baboon, baboons, mangabey, primate, primates, bonobo,
            pan troglodytes, cercopithecus, colobus guereza, piliocolobus, papio, chlorocebus, lophocebus]
  - label: wildlife_safari             # before waterfalls, so "Elephants at Murchison Falls" stays safari
    words: [elephant, elephants, lion, lions, lioness, giraffe, giraffes, buffalo, buffaloes, zebra,
            zebras, antelope, antelopes, kob, impala, wildebeest, gnu, rhino, rhinos, rhinoceros, hippo,
            hippos, hippopotamus, cheetah, cheetahs, leopard, leopards, warthog, hartebeest, topi, eland,
            oryx, gazelle, gazelles, game drive, safari vehicle,
            loxodonta, panthera leo, panthera pardus, acinonyx, giraffa, syncerus, equus quagga, kobus,
            aepyceros, connochaetes, phacochoerus, ceratotherium, diceros, alcelaphus, damaliscus]
  - label: waterfalls
    words: [waterfall, waterfalls, cascade, cascades, falls]
    unless: [falls national park, falls np, falls conservation area, falls game reserve, falls lodge,
             falls airport, falls town, falls hotel]

sources:
  # Generic client name; add your own contact (e.g. a URL) here if you want to, as Wikimedia's policy suggests.
  user_agent: "PearlRouteVision/0.1 (https://github.com/nabide63/ML_Pipeline_Summative_PearlRouteVision) python-requests"
  openverse_api: https://api.openverse.org/v1
  openverse_page_size: 100       # anonymous max is 20; up to 500 with an API key (set in .env)
  wikimedia_api: https://commons.wikimedia.org/w/api.php
  wikimedia_page_size: 50
  wikimedia_thumb_width: 960     # a standard Commons thumbnail size; others are rate-limited harder

collection:
  target_per_class: 3300         # download this many; aim to keep ~3,000 after cleaning
  fallback_threshold: 3000       # suggest --include-fallback if a class stays below this
  per_query_limit: 500           # max candidates per search term per source
  per_category_limit: 800        # max candidates per Wikimedia category tree
  request_sleep_seconds: 1.0     # pause between API calls
  download_sleep_seconds: 1.0    # pause between image downloads (upload.wikimedia.org returns 429 if faster)
  timeout_seconds: 20
  max_retries: 4
  backoff_seconds: 5             # doubles on each retry
  max_retry_after_seconds: 300   # cap on a server's Retry-After
  max_side_on_save: 1024         # downscale large images when saving
  jpeg_quality: 92
  openverse_licenses: [by, by-sa, cc0, pdm]  # allow reuse and modification
  wikimedia_subcategory_depth: 2
  # Skipped before download: archive photographers, and photos whose title or tags/categories have one of
  # these words (plurals too): things that are not photos of the experience.
  exclude_creators:
    - Luigi Amedeo di Savoia      # 1906 Rwenzori expedition, almost all black-and-white
  exclude_title_words: [map, maps, locator, poster, page, drawing, illustration, stamp, logo,
                        diagram, chart, sign, signpost, plate, herbarium, specimen, coin,
                        banknote, flag, bus, buses, BHL,
                        # people and places that are not a tourism experience
                        selfie, selfies, headshot, mugshot, passport photo, conference, seminar,
                        restaurant, menu, airport, hotel room, screenshot,
                        microscope, x-ray, skull, skeleton, museum specimen, artwork, painting,
                        mural, cartoon, clipart, sticker, taxidermy, taxidermied, stuffed]
  min_colourfulness: 6.0          # skip black-and-white photos after download

cleaning:
  min_short_side: 160
  phash_max_distance: 6
  allowed_extensions: [.jpg, .jpeg, .png, .webp]

holdout:
  demo_total: 10               # outside every split; predicted on camera
  retrain_per_class: 10        # goes into retrain_sample.zip

split:
  train: 0.70
  val: 0.15
  test: 0.15
  group_by: creator            # keep each photographer in a single split
  max_class_imbalance: 1.5     # above this, use class weights

uploads:                       # photos added through the API/UI for retraining (stored in the database)
  store_max_side: 512          # resized before storing; training uses 160 px
  jpeg_quality: 90
  max_files: 300               # most photos per upload (loose files plus zip contents)
  max_zip_mb: 100              # largest zip accepted
  max_unzipped_mb: 500         # refuse zips that expand beyond this (zip-bomb guard)
